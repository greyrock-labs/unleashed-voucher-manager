image:
  repository: ghcr.io/greyrock-labs/unleashed-voucher-manager
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

# Object naming. Empty means the chart name is used, and the release name is
# prefixed only when it does not already contain it -- so a Flux HelmRelease
# named `unleashed-voucher-manager` yields objects called
# `unleashed-voucher-manager`, not the name doubled.
nameOverride: ""
fullnameOverride: ""

# Annotations on the Deployment object itself.
annotations: {}

# Annotations on the pod template. Anything that has to restart pods on a
# Secret change belongs here rather than on the Deployment, e.g.
#   reloader.stakater.com/auto: "true"
# which matters when UNLEASHED_USERNAME/PASSWORD arrive via `existingSecret`
# backed by an ExternalSecret: without a restart the pod keeps using the old
# credential, and the app fails authentication silently rather than crashing.
podAnnotations: {}

# Pod-level securityContext, e.g. runAsNonRoot / runAsUser / runAsGroup /
# fsGroup. The image already runs as appuser (uid/gid 1001), so this is here
# to satisfy cluster policy rather than to change behaviour.
podSecurityContext: {}

# Container-level securityContext, e.g. allowPrivilegeEscalation: false and
# capabilities.drop: [ALL]. Do NOT set readOnlyRootFilesystem here -- use the
# block below, which also provisions the writable paths the app needs. The
# chart fails the render if you set it here, rather than letting it break at
# runtime.
securityContext: {}

# Run with a read-only root filesystem.
#
# Enabling this sets readOnlyRootFilesystem on the containers AND mounts the
# three paths the app writes to, because a read-only root alone would break
# it at startup:
#   * /app/frontend/public  -- the entrypoint writes runtime-config.json here
#     on every start. An empty volume would mask the logo and favicon baked
#     into the image, so an init container from the same image seeds it first.
#   * /app/frontend/.next/cache -- Next.js writes its image/fetch cache here.
#   * /tmp
readOnlyRootFilesystem:
  enabled: false

service:
  type: ClusterIP
  port: 3000

# Non-secret configuration, rendered into the Deployment as env vars.
#
# Keys left empty here are NOT rendered at all -- they are not rendered as
# `value: ""`. That matters twice over:
#   * `env` beats `envFrom` on a name collision, so anything rendered here
#     would shadow the `existingSecret` below rather than defer to it.
#   * the app distinguishes "variable unset" from "variable set to the empty
#     string"; an empty WIFI_TYPE is not "use the default", it is an invalid
#     type and disables the WiFi QR code.
# To deliberately send an empty WIFI_PASSWORD (an open network), use
# `wifiOpenNetwork` below rather than setting it to "" here.
config:
  UNLEASHED_URL: ""
  UNLEASHED_SSID: ""
  UNLEASHED_HAS_VALID_CERT: "true"
  TIMEZONE: "UTC"
  DAILY_ROLL_HOUR: "4"
  DAILY_DURATION_HOURS: "24"
  # 0 means unlimited devices may share the daily code.
  DAILY_SHARE_NUMBER: "0"
  # SSID encoded into the WiFi QR code on /display. Required, together with
  # a password (or wifiOpenNetwork), for the QR to render at all.
  WIFI_SSID: ""
  # WIFI_PASSWORD is secret-shaped; leave it empty here and supply it via
  # existingSecret instead if you'd rather not put it in values/plain env.
  # Left empty it is not rendered, so the Secret's copy is what reaches the
  # container. For an open network with no password at all, set
  # wifiOpenNetwork below.
  WIFI_PASSWORD: ""
  # WPA | WEP | nopass. Empty means unset, and the app infers it: WPA when a
  # password is present, nopass when it is deliberately blank.
  WIFI_TYPE: ""
  # Empty means unset, which the app reads as false (the SSID is broadcast).
  WIFI_HIDDEN: ""
  # Empty means unset, which the app reads as false.
  IS_LOGO_INVERTIBLE: ""

# Set true only when the guest WiFi is an open network with no password.
# The QR code has to tell "no password, deliberately" apart from "not
# configured yet", so this renders an explicit empty WIFI_PASSWORD env var
# -- the one case where an empty value is meaningful. Mutually exclusive
# with config.WIFI_PASSWORD; setting both fails the render.
wifiOpenNetwork: false

# Name of an existing Secret supplying UNLEASHED_USERNAME and
# UNLEASHED_PASSWORD. How that Secret is produced is out of scope for this
# chart. WIFI_PASSWORD may also be supplied through this Secret instead of
# `config.WIFI_PASSWORD` above, since it is secret-shaped too -- leave
# `config.WIFI_PASSWORD` empty and the Secret's value is what the container
# sees.
existingSecret: ""

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
