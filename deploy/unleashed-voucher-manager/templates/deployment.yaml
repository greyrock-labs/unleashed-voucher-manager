apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "unleashed-voucher-manager.fullname" . }}
  labels:
    {{- include "unleashed-voucher-manager.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "unleashed-voucher-manager.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "unleashed-voucher-manager.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          {{- if and .Values.wifiOpenNetwork .Values.config.WIFI_PASSWORD }}
          {{- fail "wifiOpenNetwork is true but config.WIFI_PASSWORD is also set -- an open network has no password, so set only one of them" }}
          {{- end }}
          {{- /*
            Empty values are skipped, never rendered as `value: ""`.

            Two reasons. First, `env` beats `envFrom` on a name collision in
            Kubernetes, so an always-rendered `WIFI_PASSWORD: ""` silently
            shadowed the Secret that `existingSecret` is documented to
            supply it through. Second, the entrypoint writes every key it
            sees into runtime-config.json, and the frontend distinguishes
            "unset" from "" -- an empty WIFI_TYPE is not "use the default",
            it falls through to the invalid-type branch and kills the QR
            code outright.

            An open network genuinely needs an explicit empty WIFI_PASSWORD;
            `wifiOpenNetwork` below is how you ask for one.
          */}}
          {{- $env := dict }}
          {{- range $key, $value := .Values.config }}
          {{- if ne ($value | toString) "" }}
          {{- $_ := set $env $key ($value | toString) }}
          {{- end }}
          {{- end }}
          {{- if .Values.wifiOpenNetwork }}
          {{- $_ := set $env "WIFI_PASSWORD" "" }}
          {{- end }}
          {{- if $env }}
          env:
            {{- range $key, $value := $env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          {{- if .Values.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          {{- end }}
          {{- /*
            Both probes target /rust-api/health, the frontend's proxy path to
            the backend's /api/health. That exercises frontend + proxy +
            backend in a single request, where the previous `/` only proved
            Next.js was alive -- a dead backend behind a live frontend passed.
            It is also the only viable target: the backend binds 127.0.0.1,
            so kubelet cannot reach port 8080 directly.

            /api/health always answers 200, including while the controller is
            unreachable, and answers from an in-memory cache rather than
            waiting on a controller round-trip. So neither probe fails on a
            controller outage -- failing liveness would crash-loop the pod
            over something a restart cannot fix, and failing readiness would
            pull the pod from the Service and take the guest display down.
            What these probes do catch is the process being wedged or gone.

            Timings are explicit because the k8s defaults (timeoutSeconds: 1)
            are too tight for a proxied request through Next.js.
          */}}
          livenessProbe:
            httpGet:
              path: /rust-api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /rust-api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
