apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "unleashed-voucher-manager.fullname" . }}
  labels:
    {{- include "unleashed-voucher-manager.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "unleashed-voucher-manager.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "unleashed-voucher-manager.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- /*
        readOnlyRootFilesystem is a flag rather than a plain securityContext
        key because it needs matching volumes to work at all. Setting it
        directly would render valid YAML that dies on startup.
      */}}
      {{- if hasKey (.Values.securityContext | default dict) "readOnlyRootFilesystem" }}
      {{- fail "set readOnlyRootFilesystem.enabled instead of securityContext.readOnlyRootFilesystem -- the flag also mounts the writable paths the app needs, which a bare securityContext key would not" }}
      {{- end }}
      {{- $csc := deepCopy (.Values.securityContext | default dict) }}
      {{- if .Values.readOnlyRootFilesystem.enabled }}
      {{- $_ := set $csc "readOnlyRootFilesystem" true }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.readOnlyRootFilesystem.enabled }}
      initContainers:
        # Seeds the writable volume with the assets baked into the image --
        # the logo and favicon copied in at build. Mounting an empty volume
        # over /app/frontend/public would otherwise hide them. Same image, so
        # it stays in step with whatever the main container ships.
        - name: seed-public
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c", "cp -a /app/frontend/public/. /work/"]
          {{- with $csc }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: public
              mountPath: /work
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          {{- with $csc }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if and .Values.wifiOpenNetwork (.Values.config).WIFI_PASSWORD }}
          {{- fail "wifiOpenNetwork is true but config.WIFI_PASSWORD is also set -- an open network has no password, so set only one of them" }}
          {{- end }}
          {{- /*
            Empty values are skipped, never rendered as `value: ""`.

            Two reasons. First, `env` beats `envFrom` on a name collision in
            Kubernetes, so an always-rendered `WIFI_PASSWORD: ""` silently
            shadowed the Secret that `existingSecret` is documented to
            supply it through. Second, the entrypoint writes every key it
            sees into runtime-config.json, and the frontend distinguishes
            "unset" from "" -- an empty WIFI_TYPE is not "use the default",
            it falls through to the invalid-type branch and kills the QR
            code outright.

            An open network genuinely needs an explicit empty WIFI_PASSWORD;
            `wifiOpenNetwork` below is how you ask for one.
          */}}
          {{- $env := dict }}
          {{- range $key, $value := .Values.config }}
          {{- if ne ($value | toString) "" }}
          {{- $_ := set $env $key ($value | toString) }}
          {{- end }}
          {{- end }}
          {{- if .Values.wifiOpenNetwork }}
          {{- $_ := set $env "WIFI_PASSWORD" "" }}
          {{- end }}
          {{- if $env }}
          env:
            {{- range $key, $value := $env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          {{- if .Values.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          {{- end }}
          {{- /*
            Both probes target /rust-api/health, the frontend's proxy path to
            the backend's /api/health. That exercises frontend + proxy +
            backend in a single request, where the previous `/` only proved
            Next.js was alive -- a dead backend behind a live frontend passed.
            It is also the only viable target: the backend binds 127.0.0.1,
            so kubelet cannot reach port 8080 directly.

            /api/health always answers 200, including while the controller is
            unreachable, and answers from an in-memory cache rather than
            waiting on a controller round-trip. So neither probe fails on a
            controller outage -- failing liveness would crash-loop the pod
            over something a restart cannot fix, and failing readiness would
            pull the pod from the Service and take the guest display down.
            What these probes do catch is the process being wedged or gone.

            Timings are explicit because the k8s defaults (timeoutSeconds: 1)
            are too tight for a proxied request through Next.js.
          */}}
          livenessProbe:
            httpGet:
              path: /rust-api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /rust-api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.readOnlyRootFilesystem.enabled }}
          volumeMounts:
            - name: public
              mountPath: /app/frontend/public
            - name: next-cache
              mountPath: /app/frontend/.next/cache
            - name: tmp
              mountPath: /tmp
          {{- end }}
      {{- if .Values.readOnlyRootFilesystem.enabled }}
      volumes:
        - name: public
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
