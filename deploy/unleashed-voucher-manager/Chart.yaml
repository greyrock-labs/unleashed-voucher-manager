apiVersion: v2
name: unleashed-voucher-manager
description: Guest WiFi pass manager for Ruckus Unleashed
# sources[0] is what links the published chart package to its GitHub repo on
# GHCR -- the chart-side counterpart of the image's manifest annotation. It
# must be the GitHub URL, not the Forgejo one. Without it the chart package
# is orphaned.
sources:
  - https://github.com/greyrock-labs/unleashed-voucher-manager
type: application
# Deliberately 0.0.0, and the release job refuses to publish if that changes.
# The git tag is the only version input: helm package overrides both fields
# from it, so nothing here ever reaches a published chart.
#
# A real number here would not be more honest, it would be less. It would
# claim an authority this file does not have, and it would be wrong between
# releases no matter which way it was maintained -- behind the tag if bumped
# after, ahead of a nonexistent image if bumped before.
#
# It would also be actively unsafe. deployment.yaml resolves the image as
# `.Values.image.tag | default .Chart.AppVersion`, so a plausible appVersion
# makes `helm template` from a checkout render a real, pullable, superseded
# image tag -- current templates silently paired with old code. 0.0.0 renders
# an image that cannot be pulled and fails at once.
version: 0.0.0
appVersion: "0.0.0"
