apiVersion: v2
name: unleashed-voucher-manager
description: Guest WiFi pass manager for Ruckus Unleashed
# sources[0] is what links the published chart package to its GitHub repo on
# GHCR -- the chart-side counterpart of the image's manifest annotation. It
# must be the GitHub URL, not the Forgejo one. Without it the chart package
# is orphaned.
sources:
  - https://github.com/greyrock-labs/unleashed-voucher-manager
type: application
# Kept equal to the release tag, and the release workflow refuses to publish
# if they disagree. helm package still passes --version/--app-version from
# the tag, so the tag remains what decides the published version -- this is
# here so the file is true when read, and so a local helm template or lint
# renders the version that would actually ship.
#
# Bump this in the change being released, before tagging.
version: 0.3.1
appVersion: "0.3.1"
