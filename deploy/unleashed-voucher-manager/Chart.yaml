apiVersion: v2
name: unleashed-voucher-manager
description: Guest WiFi pass manager for Ruckus Unleashed
# sources[0] is what links the published chart package to its GitHub repo on
# GHCR -- the chart-side counterpart of the image's manifest annotation. It
# must be the GitHub URL, not the Forgejo one. Without it the chart package
# is orphaned.
sources:
  - https://github.com/greyrock-labs/unleashed-voucher-manager
type: application
# Placeholders. The release workflow packages the chart with
# --version/--app-version taken from the git tag, so a published chart
# always carries the same version as the image it deploys, and these two
# values are never what ships. Bumping them here would have no effect;
# cutting a vX.Y.Z tag is what bumps the chart.
#
# Consequence: helm template/install straight from a checkout renders
# 0.0.0. Pull from oci://ghcr.io/greyrock-labs/helm to exercise a real one.
version: 0.0.0
appVersion: "0.0.0"
